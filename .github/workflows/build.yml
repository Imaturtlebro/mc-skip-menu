name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

dpermissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC via CMake)
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item build\Release\hook.dll dist\
          Copy-Item build\Release\launcher.exe dist\
          Compress-Archive -Path dist\* -DestinationPath mc-skip-menu.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mc-skip-menu
          path: mc-skip-menu.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mc-skip-menu.zip
