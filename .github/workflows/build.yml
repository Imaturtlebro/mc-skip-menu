name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (MSVC via CMake)
        id: build
        shell: pwsh
        run: |
          try {
            cmake -S . -B build 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -ne 0) { throw "configure failed" }
            cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
          } catch {
            # commit the log to fail-log.txt so it is publicly readable
            git config user.email "ci@noreply.users.noreply.github.com"
            git config user.name "ci"
            git add build.log
            git commit -m "ci: build log" || echo "no log"
            git push || echo "push failed"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item build\Release\hook.dll dist\
          Copy-Item build\Release\launcher.exe dist\
          Compress-Archive -Path dist\* -DestinationPath mc-skip-menu.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mc-skip-menu
          path: mc-skip-menu.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mc-skip-menu.zip
